name: Bug report
description: Report a problem with PersonaFinetuner
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PersonaFinetuner. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the issue.
      placeholder: |
        1. Run setup.bat / start the app
        2. Upload …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. Windows 11, Ubuntu 22.04
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: 3.11.x
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: NVIDIA GPU model and VRAM if relevant (training/inference issues)
      placeholder: RTX 3060 12GB
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant terminal or browser console output. Redact personal data.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, upload format, related issues, etc.
    validations:
      required: false
